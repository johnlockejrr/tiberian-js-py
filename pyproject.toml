[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiberian-js-py"
version = "0.1.0"
description = "Tiberian Hebrew IPA via Python + hebrew-transliteration (Node) Tiberian schema"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Khan Tiberian Project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
tiberian = "tiberian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiberian"]

[tool.hatch.build.targets.wheel.force-include]
"corpus" = "tiberian/data/corpus"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
